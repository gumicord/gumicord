[package]
name = "gumicord-screenshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "screenshot"
path = "src/main.rs"

[dependencies]
# The scenes come from the app, but nothing here opens a window, a
# dialog, a webview, or the OS key store — so the two features that pull
# in `wry`, `gtk` and `keyring` stay off, and the build needs no GTK,
# WebKitGTK or D-Bus headers.
#
# The paths are spelled out rather than `workspace = true` for the same
# reason: inheriting also carries the workspace's own default-features,
# which a member may not override (MSRV 1.97 rejects the manifest).
gumicord-app = { path = "../../app/core", default-features = false }
gumicord-platform = { path = "../../render/platform", default-features = false }
gumicord-render.workspace = true
gumicord-uitree.workspace = true
png.workspace = true
