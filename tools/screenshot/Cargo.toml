[package]
name = "gumicord-screenshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "screenshot"
path = "src/main.rs"

[dependencies]
# The scenes come from the app, but nothing here opens a window, a
# dialog, a webview, or the OS key store — so the two features that pull
# in `wry`, `gtk` and `keyring` stay off, and the build needs no GTK,
# WebKitGTK or D-Bus headers.
gumicord-app = { workspace = true, default-features = false }
gumicord-platform = { workspace = true, default-features = false }
gumicord-render.workspace = true
gumicord-uitree.workspace = true
png.workspace = true
