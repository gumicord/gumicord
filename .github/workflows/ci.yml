name: CI

# Spec-driven development only works if the build fails the moment spec and
# implementation disagree, whether or not anyone ran the checks locally.
#
# The dev machine has 4 cores and 8 GB, so .cargo/config.toml caps parallelism
# at jobs = 2. Runners have room, so CARGO_BUILD_JOBS overrides that here, and
# the heavy checks (clippy --all-targets) run here rather than locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Drop older runs when a branch is pushed to again.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Overrides the dev machine's jobs = 2, as .cargo/config.toml intends.
  CARGO_BUILD_JOBS: 4
  # No debug info needed here; saves disk and cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ────────────────────────────────────────────────────────────
  # Spec checks. Does not build the workspace, so it finishes in seconds and
  # is the first signal a PR gets.
  # ────────────────────────────────────────────────────────────
  spec:
    name: Spec (ABI / schema / SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix sdk

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Only xtask and its dependencies get built.
          shared-key: xtask

      # Checks together that the JSON Schema accepts the official samples and
      # rejects every malformed one, that the SDK types reject code that must
      # not compile, that the generated spec table and ids.ts are current, and
      # that no stable ID was removed or renamed.
      - name: cargo xtask check-light
        run: cargo xtask check-light

  # ────────────────────────────────────────────────────────────
  # The Rust workspace. Every check too heavy to run locally lives here.
  # ────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the current target; Linux and macOS run to catch
        # portability problems in dependencies early.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The Secret Service backend links the system D-Bus library.
      - name: Install D-Bus headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # --all-targets doubles memory use and destabilised the dev machine, so
      # it is off there. Tests and examples get linted here instead.
      - name: clippy (all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # ────────────────────────────────────────────────────────────
  # Builds something runnable every time, on every platform.
  #
  # Passing checks say nothing about whether the app starts and draws. Having
  # a downloadable build always available shortens both reviews and bug
  # reports.
  #
  # One matrix, five entries: desktop on Windows/macOS/Linux plus the
  # Android APK and the unsigned iOS IPA. Mobile entries came from their
  # own jobs; keeping them here means one place lists everything the
  # nightly release publishes. Steps that do not apply to an entry are
  # skipped by kind, so each leg reads top to bottom as its own recipe.
  #
  # PRs use thin LTO for speed; pushes to main and manual runs use the same
  # fat LTO profile as releases, which is what the recorded binary size and
  # startup figures were measured with.
  # ────────────────────────────────────────────────────────────
  dist:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs fail independently; one red phone build must not eat the rest.
      fail-fast: false
      matrix:
        include:
          - kind: desktop
            label: windows
            os: windows-latest
            bin: gumicord.exe
            target: ''
          - kind: desktop
            label: linux
            os: ubuntu-latest
            bin: gumicord
            target: ''
          - kind: desktop
            label: macos
            os: macos-latest
            bin: gumicord
            target: ''
          # arm64 phones plus the x86_64 emulator. Each ABI multiplies
          # native build time, but someone does test on the emulator.
          - kind: android
            label: android
            os: ubuntu-latest
            target: aarch64-linux-android x86_64-linux-android
          - kind: ios
            label: ios
            os: macos-latest
            target: aarch64-apple-ios
    env:
      PROFILE: ${{ github.event_name == 'pull_request' && 'release' || 'dist' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Desktop Linux links the system D-Bus library like the checks do.
      - name: Install D-Bus headers
        if: matrix.os == 'ubuntu-latest' && matrix.kind == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Add mobile target
        if: matrix.kind != 'desktop'
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # A different profile, so artifacts cannot be shared with the checks.
          shared-key: dist

      - name: Install cargo-ndk
        if: matrix.kind == 'android'
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        if: matrix.kind == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: matrix.kind == 'android'

      - name: Install NDK and platform
        if: matrix.kind == 'android'
        # Must match app/android/app/build.gradle (ndkVersion).
        run: sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.kind == 'android'
        with:
          gradle-version: '8.7'

      - name: Build
        if: matrix.kind == 'desktop'
        shell: bash
        run: cargo build -p gumicord-desktop --profile "$PROFILE"

      # Ship the themes so they can be swapped with GUMICORD_THEME.
      - name: Assemble
        if: matrix.kind == 'desktop'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/$PROFILE/${{ matrix.bin }}" dist/
          cp -r examples/themes dist/themes
          cp LICENSE dist/
          # The first thing anyone reads; lead with what does not work yet.
          cat > dist/README.txt <<'TXT'
          Gumicord (development build)

            ${{ matrix.bin }}    run it directly
            themes/             themes; to swap one in:
                                  set GUMICORD_THEME=themes/midnight/theme.json
                                  ${{ matrix.bin }}

          Signing in needs the Discord app on your phone to scan a QR code:
          there is no password login yet, and no voice, no reactions, no
          search, and no plugins. The UI is Japanese only for now.

          WARNING: connecting to Discord with a third-party client breaks
          their terms of service and can cost you your account.

          Progress: https://github.com/gumicord/gumicord/blob/main/spec/07-roadmap.md
          TXT
          ls -l "dist/${{ matrix.bin }}"

      - name: Build the Rust cdylib
        if: matrix.kind == 'android'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o app/android/app/src/main/jniLibs build --release -p gumicord-android
          # Rust's C++ runtime is not inside the APK otherwise.
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            app/android/app/src/main/jniLibs/arm64-v8a/
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" \
            app/android/app/src/main/jniLibs/x86_64/

      - name: Assemble debug APK
        if: matrix.kind == 'android'
        run: gradle -p app/android assembleDebug

      - name: Build the Rust staticlib
        if: matrix.kind == 'ios'
        run: |
          cargo build --release --target aarch64-apple-ios -p gumicord-ios
          mkdir -p app/ios/lib
          cp target/aarch64-apple-ios/release/libgumicord_ios.a app/ios/lib/

      - name: Build unsigned .app
        if: matrix.kind == 'ios'
        run: |
          xcodebuild -project app/ios/Gumicord.xcodeproj -scheme Gumicord \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO build

      - name: Zip Payload into .ipa
        if: matrix.kind == 'ios'
        run: |
          cd build/ios-dd/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r Gumicord.app Payload/
          zip -r Gumicord-unsigned.ipa Payload

      - name: Upload desktop build
        if: matrix.kind == 'desktop'
        uses: actions/upload-artifact@v4
        with:
          name: gumicord-${{ matrix.os }}-${{ github.sha }}
          path: dist/
          retention-days: 14

      # One file to run, built from the binary above with stock tooling.
      - name: Build AppImage
        if: matrix.kind == 'desktop' && matrix.os == 'ubuntu-latest'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -L -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appdir AppDir -e "target/$PROFILE/gumicord" \
            -d packaging/linux/gumicord.desktop -i packaging/icons/app-icon.png \
            --output appimage
          ls -l Gumicord-*.AppImage

      - name: Upload AppImage
        if: matrix.kind == 'desktop' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gumicord-appimage-${{ github.sha }}
          path: Gumicord-*.AppImage
          retention-days: 14

      - name: Build app bundle and dmg
        if: matrix.kind == 'desktop' && matrix.os == 'macos-latest'
        run: |
          mkdir -p Gumicord.app/Contents/MacOS Gumicord.app/Contents/Resources dmg-staging
          cp "target/$PROFILE/gumicord" Gumicord.app/Contents/MacOS/
          cp packaging/macos/Info.plist Gumicord.app/Contents/
          rm -rf "$RUNNER_TEMP/icon.iconset"
          mkdir "$RUNNER_TEMP/icon.iconset"
          for s in 16 32 128 256 512; do
            sips -s format png -z $s $s packaging/icons/app-icon.png \
              --out "$RUNNER_TEMP/icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -s format png -z $((s*2)) $((s*2)) packaging/icons/app-icon.png \
              --out "$RUNNER_TEMP/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$RUNNER_TEMP/icon.iconset" \
            -o Gumicord.app/Contents/Resources/Gumicord.icns
          mv Gumicord.app dmg-staging/
          cp -r dist/themes dist/LICENSE dist/README.txt dmg-staging/
          hdiutil create -volname Gumicord -srcfolder dmg-staging -ov Gumicord.dmg
          ls -l Gumicord.dmg

      - name: Upload dmg
        if: matrix.kind == 'desktop' && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gumicord-dmg-${{ github.sha }}
          path: Gumicord.dmg
          retention-days: 14

      - name: Upload APK
        if: matrix.kind == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: gumicord-android-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload IPA
        if: matrix.kind == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: gumicord-ios-${{ github.sha }}
          path: build/ios-dd/Build/Products/Release-iphoneos/Gumicord-unsigned.ipa
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # Nightly releases in a separate repo. Dated tags keep history;
  # plain releases, no prerelease flag: the repo itself is the
  # nightly channel. GITHUB_TOKEN cannot cross the repo boundary,
  # and PATs always expire, so this mints an installation token
  # from a GitHub App (private key has no expiry): NIGHTLY_APP_ID
  # and NIGHTLY_APP_PRIVATE_KEY hold the app's id and key, and the
  # app must be installed on gumicord/gumicord-nightly with
  # Contents read and write.
  nightly:
    name: Nightly release
    needs: [dist]
    # Main pushes only: PRs must not publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gumicord-*
          path: dist

      - name: Compute tag
        id: tag
        run: echo "name=nightly-$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The build filenames carry no version, so rename with the tag to
      # keep downloads distinguishable across releases. Desktop entries
      # are directories; zip one per OS.
      - name: Rename assets
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          SHA="${{ github.sha }}"
          mv "dist/gumicord-android-$SHA/app-debug.apk" "dist/gumicord-$TAG.apk"
          mv "dist/gumicord-ios-$SHA/Gumicord-unsigned.ipa" "dist/gumicord-$TAG.ipa"
          mv "dist/gumicord-appimage-$SHA/"*.AppImage "dist/gumicord-$TAG-linux.AppImage"
          mv "dist/gumicord-dmg-$SHA/"*.dmg "dist/gumicord-$TAG-macos.dmg"
          for entry in windows-latest ubuntu-latest macos-latest; do
            case "$entry" in
              windows-latest) short=windows; bin=gumicord.exe ;;
              ubuntu-latest) short=linux; bin=gumicord ;;
              macos-latest) short=macos; bin=gumicord ;;
            esac
            # Artifacts lose the executable bit on the way; restore it, or
            # the unzipped binary refuses to start.
            chmod +x "dist/gumicord-$entry-$SHA/$bin"
            (cd "dist/gumicord-$entry-$SHA" && zip -qr "../gumicord-$TAG-$short.zip" .)
          done
          ls -l dist

      # Short-lived installation token (expires after the run); the key
      # itself never expires, so there is nothing to rotate yearly.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.NIGHTLY_APP_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: gumicord
          repositories: gumicord-nightly

      - uses: softprops/action-gh-release@v2
        with:
          repository: gumicord/gumicord-nightly
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            dist/*.apk
            dist/*.ipa
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg
          fail_on_unmatched_files: true
          body: |
            Automated nightly for https://github.com/${{ github.repository }}/commit/${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            - Desktop builds (Windows / Linux / macOS), Linux AppImage, unsigned macOS dmg,
              debug APK (arm64 + x86_64) and unsigned IPA for sideloading.
            - Debug builds: slower, larger, logging enabled. No signing identity exists yet.
            - WARNING: connecting to Discord with a third-party client breaks
              their terms of service and can cost you your account.

  # ────────────────────────────────────────────────────────────
  # Confirms rust-version in Cargo.toml is true. A declared value nobody
  # checks always drifts eventually.
  # ────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97

      # Same system dependency as the other Linux builds.
      - name: Install D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: cargo check
        run: cargo check --workspace --all-targets
