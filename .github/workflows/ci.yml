name: CI

# 仕様駆動開発の要は「仕様と実装がずれた瞬間に落ちること」である。
# 手元で回さなくても、ここが必ず落ちる。
#
# ■ 開発機で重いビルドを回さなくて済むようにしてある
#   .cargo/config.toml は jobs = 2 で並列数を絞ってある (4 コア / 8 GB の
#   開発機を守るため)。CI ランナには余裕があるので CARGO_BUILD_JOBS で上書きする。
#   clippy --all-targets も、開発機ではなくここで走らせる。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同じブランチに続けて push したとき、古い実行は捨てる
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 開発機向けの jobs = 2 を打ち消す (.cargo/config.toml の意図した上書き経路)
  CARGO_BUILD_JOBS: 4
  # CI ではデバッグ情報が要らない。ディスクとキャッシュを節約する
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ────────────────────────────────────────────────────────────
  # 仕様まわりの検査。Rust ワークスペースをビルドしないので数十秒で終わる。
  # PR に最初に返る信号はこれになる。
  # ────────────────────────────────────────────────────────────
  spec:
    name: 仕様 (ABI / スキーマ / SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: 依存の取得
        run: |
          npm ci
          npm ci --prefix sdk

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # xtask とその依存 (serde / gumicord-uitree) しかビルドしない
          shared-key: xtask

      # 以下をまとめて確認する:
      #   - JSON Schema が公式サンプルを通し、異常系 31 件で確実に落ちること
      #   - SDK の型が、通ってはいけないコード 5 件を実際に弾くこと
      #   - ids.rs から生成した spec/03-uitree.md と sdk/src/ids.ts が最新であること
      #   - 安定 ID が削除・改名されていないこと (EXT-003 / C1・C2)
      - name: cargo xtask check-light
        run: cargo xtask check-light

  # ────────────────────────────────────────────────────────────
  # Rust 本体。開発機では走らせない重い検査はすべてここに置く。
  # ────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # M1.1 の主対象は Windows。Linux は依存の移植性を早期に検出するために回す。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 整形
        run: cargo fmt --all --check

      # 開発機では --all-targets を既定から外してある (メモリ消費が倍になり、
      # 実際に OS ごと不安定になったため)。テスト・examples を含む全ターゲットの
      # clippy はここで担保する。
      - name: clippy (全ターゲット)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: テスト
        run: cargo test --workspace

  # ────────────────────────────────────────────────────────────
  # 動くものを毎回作って残す。
  #
  # 検査が全部通っても「起動して画面が出るか」は分からない。落として
  # 実行できるものが常にあれば、レビューでも不具合報告でも話が早い。
  #
  # ■ Windows だけなのは M1.1 のスコープがそうだから
  #   macOS / Linux は M2 (spec/07-roadmap.md 7 章)。移植性そのものは
  #   rust ジョブが ubuntu でビルドして担保している。
  #
  # ■ プロファイルを使い分ける
  #   PR は速さが要るので thin LTO (release)。main への push と手動実行では
  #   配布物と同じ fat LTO (dist) で作る。ADR-0001 に記録した
  #   バイナリ 4.66MB / 起動 332ms は dist の値であり、比べるならこちら。
  # ────────────────────────────────────────────────────────────
  dist:
    name: 配布物 (Windows)
    runs-on: windows-latest
    env:
      PROFILE: ${{ github.event_name == 'pull_request' && 'release' || 'dist' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # 検査ジョブとはプロファイルが違うので成果物を共有できない
          shared-key: dist

      - name: ビルド
        shell: bash
        run: cargo build -p gumicord-desktop --profile "$PROFILE"

      # テーマを同梱する。GUMICORD_THEME で差し替えて見比べられるようにする
      # (README「現在地」参照)。
      - name: 配布物をまとめる
        shell: bash
        run: |
          mkdir -p dist
          cp "target/$PROFILE/gumicord.exe" dist/
          cp -r examples/themes dist/themes
          cp LICENSE dist/
          # 落とした人が最初に読むもの。いまは何ができないかを先に書く
          cat > dist/README.txt <<'TXT'
          Gumicord (開発版ビルド)

            gumicord.exe    そのまま実行できます
            themes/         テーマ。差し替えるには:
                              set GUMICORD_THEME=themes\midnight\theme.json
                              gumicord.exe

          ⚠️ まだ Discord には接続しません。表示されているギルド・チャンネル・
             メッセージはすべて固定のダミーデータです。日本語入力もまだです。
             進捗: https://github.com/gumicord/gumicord/blob/main/spec/07-roadmap.md
          TXT
          ls -l dist/gumicord.exe

      - uses: actions/upload-artifact@v4
        with:
          name: gumicord-windows-${{ github.sha }}
          path: dist/
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # Cargo.toml の rust-version = "1.97" が嘘でないことを確認する。
  # 宣言しておいて検査しない値は、いずれ必ずずれる。
  # ────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: cargo check
        run: cargo check --workspace --all-targets
