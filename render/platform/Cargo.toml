[package]
name = "gumicord-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["keychain"]
# The parts that link a real webview to present a captcha: WebView2 on
# Windows, WKWebView on macOS and iOS — all through `wry`. Off, the
# captcha host is the unsupported placeholder, so a challenge reports
# `CaptchaError::Unsupported` and the login flow moves on.
webview = ["dep:wry"]
# Enable WebKitGTK captcha on Linux. This requires the libwebkit2gtk system
# library. Disabled by default so the app can run on Linux without it.
webview-linux = ["dep:wry", "dep:gtk"]
# The OS secure store: Keychain on macOS and iOS, the Secret Service on
# Linux, all through `keyring`. Off, nothing is stored and the user logs
# in again each start — the same line as a platform with no secure store.
keychain = ["dep:keyring"]

[dependencies]
gumicord-render.workspace = true
gumicord-uitree.workspace = true
winit.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
unicode-segmentation.workspace = true
thiserror.workspace = true
tracing.workspace = true
log.workspace = true
# Not gated to Android on purpose: the machine that writes the JNI calls
# has no NDK, so compiling them here is the only check they get before CI.
# None of it runs elsewhere.
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
wry = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wry = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { workspace = true, optional = true }
raw-window-handle.workspace = true
wry = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
arboard.workspace = true
keyring = { workspace = true, optional = true }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-ui-kit.workspace = true
block2.workspace = true
png.workspace = true
raw-window-handle.workspace = true
# iOS Keychain through the same keyring backend as macOS.
keyring = { workspace = true, optional = true }

# GameActivity backend for the Android shell. Desktop builds never see it.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-game-activity"] }
android_logger.workspace = true