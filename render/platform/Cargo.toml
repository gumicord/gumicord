[package]
name = "gumicord-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
gumicord-render.workspace = true
gumicord-uitree.workspace = true
winit.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
unicode-segmentation.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
wry.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
arboard.workspace = true

# GameActivity backend for the Android shell. Desktop builds never see it.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-game-activity"] }
