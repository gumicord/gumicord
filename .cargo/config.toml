# Lets `cargo xtask` run the task runner, so cargo alone is enough and
# neither just nor make is needed.
[alias]
xtask = "run --package xtask --"

[build]
# Why the job count is held down (what happened on 2026-08-14).
#
# The development machine has four logical cores and 7.9 GB. Building
# wgpu, rusqlite, aws-lc-sys and the rest at the default job count
# exhausted memory and disk and destabilised the whole OS:
#
#     - rustc died with STATUS_STACK_BUFFER_OVERRUN (0xc0000409)
#     - os error 1453 (ERROR_NO_SYSTEM_RESOURCES)
#     - Volsnap deleted the shadow copies
#     - unrelated applications (Chrome) crashed with it
#
# One rustc can take 1-2 GB. Only a machine with memory to spare should
# run one per core.
#
# With more memory, override it:
#     CARGO_BUILD_JOBS=8 cargo build
jobs = 2
