[package]
name = "gumicord-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
gumicord-uitree.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# rquickjs ships prebuilt bindings for desktop targets only. Mobile targets
# generate them with bindgen instead; desktop builds never pay for it.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
