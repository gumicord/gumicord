[workspace]
resolver = "3"
members = [
    "core/model",
    "core/gateway",
    "core/rest",
    "core/store",
    "core/uitree",
    "core/theme",
    "core/plugin",
    "render/render",
    "render/platform",
    "app/core",
    "app/desktop",
    "xtask",
]
# スパイクは捨てる前提のコードなので、ワークスペースには含めない。
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/gumicord/gumicord"
authors = ["ねんねこ"]

# 依存のバージョンはここで一元管理する。
# バージョンはスパイク S1〜S4 で実際にビルド・動作確認したものを採用している。
[workspace.dependencies]
# 内部クレート
gumicord-model = { path = "core/model" }
gumicord-gateway = { path = "core/gateway" }
gumicord-rest = { path = "core/rest" }
gumicord-store = { path = "core/store" }
gumicord-uitree = { path = "core/uitree" }
gumicord-theme = { path = "core/theme" }
gumicord-plugin = { path = "core/plugin" }
gumicord-render = { path = "render/render" }
gumicord-platform = { path = "render/platform" }
gumicord-app = { path = "app/core" }

# 描画 (S1 / S2 で検証済み)
wgpu = "30"
winit = "0.30"
cosmic-text = "0.19"
# フォントのフォールバックを自前で持つために要る (Han 統合への対処)
unicode-script = "0.5"
unicode-segmentation = "1"
sys-locale = "0.3"
accesskit = "0.24"
accesskit_winit = "0.33"
bytemuck = "1"
pollster = "1"

# プラグイン (S3 で検証済み)
rquickjs = "0.12"

# 通信 (S4 で検証済み)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# ⚠️ 暗号の実装を**明示的に選ぶ**。rustls は自分の機能から自動で選ぶが、
# 「ちょうど 1 つ有効」でないと選べずに実行時 panic になる。どの機能が
# 立つかは依存の合流次第で変わるので、他人任せにしない
rustls = "0.23"
futures-util = "0.3"
zstd = "0.13"

# QR ログイン (ADR-0007)。RSA-2048 OAEP-SHA256 の復号に要る
# ⚠️ sha2 と rand_core は rsa の再エクスポートを使う。別に足すと版がずれる
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"

# QR ログイン (ADR-0007) の QR を描くため。**符号化だけで、描くのは自前**
qrcode = { version = "0.14", default-features = false }

# 永続化
rusqlite = { version = "0.38", features = ["bundled", "backup"] }

# 共通
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# ■ ビルドの資源消費について
#
#   開発機の実測 (2026-08-14): 4 論理コア / 物理メモリ 7.9 GB。
#   当初 release に lto="fat" + codegen-units=1 を既定で入れたところ、
#   ディスクとメモリを圧迫してシステム全体を不安定にした。
#   (Volsnap がシャドウコピーを削除、ページファイルのピークが 3.5 GB)
#
#   **計測のための設定を、日常のビルドの既定にしてはならない。**
#   日常は release (thin LTO) を使い、配布物と性能計測のときだけ dist を使う。

[profile.release]
opt-level = 3
# thin LTO は fat の大半の効果を、ごく一部のメモリと時間で得られる。
lto = "thin"
codegen-units = 16
strip = true

# 配布物と性能計測のためのプロファイル。
# ADR-0001 に記録した実測値 (バイナリ 4.66MB / 起動 332ms) はこの設定によるもの。
#
#   cargo build --profile dist
#
# ⚠️ リンク時に数 GB のメモリを使う。メモリの少ない機械では他を閉じてから。
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

# 依存クレートは dev ビルドでも最適化する。
# 最適化なしの wgpu / cosmic-text は描画が実用にならないため。
# opt-level=3 ではなく 2 にしているのは、ビルド時の資源消費を抑えるため。
# 描画性能の差はこの用途では体感できない。
[profile.dev.package."*"]
opt-level = 2
