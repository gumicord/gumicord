[workspace]
resolver = "3"
members = [
    "core/markdown",
    "core/model",
    "core/gateway",
    "core/rest",
    "core/store",
    "core/uitree",
    "core/theme",
    "core/plugin",
    "render/render",
    "render/platform",
    "app/core",
    "app/desktop",
    "xtask",
]
# Spikes are throwaway code, so they stay out of the workspace.
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/gumicord/gumicord"
authors = ["ねんねこ"]

# Dependency versions live here. Each is one the S1-S4 spikes actually
# built and ran with.
[workspace.dependencies]
# Internal crates
gumicord-markdown = { path = "core/markdown" }
gumicord-model = { path = "core/model" }
gumicord-gateway = { path = "core/gateway" }
gumicord-rest = { path = "core/rest" }
gumicord-store = { path = "core/store" }
gumicord-uitree = { path = "core/uitree" }
gumicord-theme = { path = "core/theme" }
gumicord-plugin = { path = "core/plugin" }
gumicord-render = { path = "render/render" }
gumicord-platform = { path = "render/platform" }
gumicord-app = { path = "app/core" }

# Drawing
wgpu = "30"
winit = "0.30"
# In-window webview for hCaptcha (ADR-0007); only used to show a third-party
# challenge, never to render our own UI.
wry = "0.56"
cosmic-text = "0.19"
# Needed to do font fallback ourselves, around Han unification.
unicode-script = "0.5"
unicode-segmentation = "1"
sys-locale = "0.3"
accesskit = "0.24"
accesskit_winit = "0.33"
bytemuck = "1"
pollster = "1"

# Plugins
rquickjs = "0.12"

# Networking
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# The crypto provider is chosen explicitly. rustls picks one from its own
# features, but only when exactly one is enabled, and panics at runtime
# otherwise. Which features end up on depends on how dependencies merge.
rustls = "0.23"
futures-util = "0.3"
zstd = "0.13"

# Windows APIs directly; only DPAPI for now.
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Graphics_Gdi"] }

# QR login, for RSA-2048 OAEP-SHA256 decryption.
# sha2 and rand_core come from rsa's re-exports; adding them separately would
# drift in version.
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"

# QR login: encoding only. The drawing is ours.
qrcode = { version = "0.14", default-features = false }

# Images. PNG only: the CDN is asked for .png, so a general image library
# is not needed. Attachments, which are whatever the user uploaded, will
# need another look.
png = "0.18"

# Persistence
rusqlite = { version = "0.38", features = ["bundled", "backup"] }

# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# What a build costs.
#
# Measured on the development machine (2026-08-14): four logical cores,
# 7.9 GB. Making lto="fat" with codegen-units=1 the release default
# crowded the disk and memory enough to destabilise the whole system:
# Volsnap deleted the shadow copies, and the page file peaked at 3.5 GB.
#
# A setting for measurement must not become the everyday default. Every
# day is release (thin LTO); dist is for distribution and measurement.

[profile.release]
opt-level = 3
# Thin LTO gets most of what fat does, for a fraction of the memory.
lto = "thin"
codegen-units = 16
strip = true

# For distribution and performance measurement. The numbers recorded in
# ADR-0001 (4.66MB binary, 332ms start) come from this.
#
#   cargo build --profile dist
#
# Linking takes several GB. Close other things on a small machine.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# What the disk costs.
#
# Measured on the development machine (2026-08-22): target/ grew to
# 19.8 GB and left 3.7 GB free on C:.
#
#     target/debug/incremental   8.2 GB   <- intermediate, safe to delete
#     target/debug/deps         the rest  <- mostly debug info
#
# Deleting incremental works, but it grows back, so the debug info is narrowed instead.

[profile.dev]
opt-level = 1
# Line numbers only, so backtraces still carry file:line.
# What is lost is stepping with variable values, which can be put back.
debug = "line-tables-only"

# Dependencies are optimised even in dev: unoptimised wgpu and
# cosmic-text are too slow to draw with. Level 2 rather than 3 keeps the
# build cheaper, and the difference is not noticeable here.
[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: stepping into wgpu or cosmic-text
# almost never happens, and this was most of target/. Function names stay
# in the symbol table, so backtraces remain readable.
debug = false
