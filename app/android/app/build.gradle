plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.gumicord.app'
    // Must match the NDK installed in CI (see .github/workflows/ci.yml).
    ndkVersion '26.3.11579264'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.gumicord.app'
        // GameActivity needs 21+; 24 matches the official client's floor
        // (Android 7+) while skipping the oldest legacy paths. Notification
        // channels and friends are 26+, so the notification work must carry
        // pre-26 fallbacks.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.0.3'
        // Only 64-bit ARM for now: that is every phone shipped in years, and
        // each ABI multiplies native build time. 32-bit ARM and x86 emulators
        // come back when someone needs them.
        // arm64 phones plus the x86_64 emulator, which cannot run arm64
        // code without translation.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        // Committed on purpose: a debug key holds no release trust, and a
        // checked-in key signs every nightly identically. Passwords are the
        // conventional debug values, not secrets.
        nightly {
            storeFile rootProject.file('nightly.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Channels as flavors: AGP has no per-buildType applicationId, so
    // the nightly slot lives here. Nightly goes out as debug under its
    // own ID so both channels install side by side (see
    // packaging/README.md, AltStore sources). Stable keeps the
    // defaultConfig ID.
    flavorDimensions 'channel'
    productFlavors {
        nightly {
            dimension 'channel'
            applicationId 'dev.gumicord.nightly'
        }
        stable {
            dimension 'channel'
        }
    }

    buildTypes {
        debug {
            debuggable true
            // One shared debug key for every nightly: CI runners are
            // throwaway machines, so the default debug keystore would sign
            // every build differently and updates would refuse to install.
            // This is NOT the release key; release signing arrives with
            // the distribution work.
            signingConfig signingConfigs.nightly
            // The Rust cdylib arrives via jniLibs (see CI); never strip or
            // shrink what Gradle cannot see into.
            minifyEnabled false
            packagingOptions {
                // Rust's libc++_shared.so duplicates the NDK copy; either
                // one loads the same.
                pickFirst 'lib/arm64-v8a/libc++_shared.so'
                pickFirst 'lib/x86_64/libc++_shared.so'
            }
        }
        release {
            minifyEnabled false
            packagingOptions {
                pickFirst 'lib/arm64-v8a/libc++_shared.so'
                pickFirst 'lib/x86_64/libc++_shared.so'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// rustls-platform-verifier is a Rust crate with a Kotlin component, and the
// two must ship the same version or the JNI calls fail at runtime. Cargo.lock
// already pins that component, so it is the single source of truth here;
// reading it as a ValueSource keeps the configuration cache warm, unlike the
// `cargo metadata` subprocess this replaces.
def rustlsLockFile = rootProject.file('../../Cargo.lock')

abstract class RustlsVersion implements ValueSource<String, RustlsVersion.Params> {
    interface Params extends ValueSourceParameters {
        RegularFileProperty getLockFile()
    }

    static final String CRATE_NAME = 'rustls-platform-verifier-android'

    @Override
    String obtain() {
        def lockFile = parameters.lockFile.get().asFile
        def lines = lockFile.readLines()
        def idx = lines.findIndexOf { it.trim() == "name = \"$CRATE_NAME\"" }
        def version = idx < 0 ? null : lines.drop(idx + 1)
            .find { it.trim().startsWith('version = ') }
            ?.find(/"([^"]*)"/) { match, v -> v }
        if (!version) {
            throw new GradleException("$CRATE_NAME not found in $lockFile")
        }
        return version
    }
}

def rustlsPlatformVerifierVersion = providers.of(RustlsVersion) { spec ->
    spec.parameters.lockFile.set(rustlsLockFile)
}

dependencies {
    // GameActivity itself, from Google Maven. The Rust side drives through
    // winit's android-game-activity feature; nothing here subclasses it.
    // Version paired with android-activity 0.6, which supports the 4.x
    // Java interface only; 2.x crashes before any Rust runs.
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // rustls-platform-verifier checks HTTPS against the system trust store
    // through the JVM. Without this every HTTPS request fails on Android.
    //
    // No version on purpose: the Kotlin component must match the Rust crate
    // exactly, and Cargo.lock already pins it. The version is forced in from
    // there below rather than duplicated here. No `@aar` suffix either: the
    // upstream maven repository publishes real POMs with `<packaging>aar</packaging>`.
    implementation "org.rustls:rustls-platform-verifier"
}

configurations.all {
    // The Kotlin component is declared without a version above; hand it the
    // one Cargo.lock pins so the two can never drift.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.rustls'
                && details.requested.name == 'rustls-platform-verifier') {
            details.useVersion(rustlsPlatformVerifierVersion.get())
            details.because("must match the Rust crate's own Android component")
        }
    }
    // kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes; the old
    // split artifacts (via games-activity) only duplicate them.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
