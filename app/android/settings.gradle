import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Resolved once here so app/build.gradle can pin the exact AAR version.
// The crate's maven/ ships no maven-metadata.xml (only
// maven-metadata-local.xml), and metadataSources { artifact() } ignores
// metadata anyway, so a dynamic version like latest.release can never
// resolve. The POM packaging (aar) is ignored too, so the consumer must
// ask for @aar explicitly.
def rustlsMaven = findRustlsPlatformVerifier()
gradle.ext.rustlsPlatformVerifierVersion = rustlsMaven.version

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // rustls-platform-verifier verifies HTTPS against the system trust
        // store through the JVM. Without this its Kotlin helper is missing
        // and every HTTPS request fails on Android.
        maven {
            url = rustlsMaven.url
            metadataSources { artifact() }
        }
    }
}

rootProject.name = "Gumicord"
include(":app")

Map findRustlsPlatformVerifier() {
    def dependencyText = providers.exec {
        it.workingDir = new File(rootDir, "../..")
        it.commandLine(
            "cargo", "metadata",
            "--format-version", "1",
            "--filter-platform", "aarch64-linux-android",
            "--manifest-path", "Cargo.toml",
        )
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def rustlsPackage = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }
    def manifestPath = file(rustlsPackage.manifest_path)
    return [
        url: new File(manifestPath.parentFile, "maven").path,
        version: rustlsPackage.version.toString(),
    ]
}
