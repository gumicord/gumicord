pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // rustls-platform-verifier verifies HTTPS against the system trust
        // store through the JVM. Without this its Kotlin helper is missing
        // and every HTTPS request fails on Android.
        //
        // Since 0.7.1 the crate no longer bundles the AAR or a local Maven
        // repository; every artifact lives on the upstream maven-archive
        // branch, which Gradle consumes as an ordinary remote repository.
        // That one publishes real POMs and maven-metadata.xml, so the
        // `metadataSources { artifact() }` workaround the crate-local copy
        // needed (and its forced `@aar` suffix) are both gone. The artifact
        // version is forced from Cargo.lock in app/build.gradle.
        maven {
            url = "https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/"
        }
    }
}

rootProject.name = "Gumicord"
include(":app")