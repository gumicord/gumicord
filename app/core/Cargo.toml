[package]
name = "gumicord-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["webview", "keychain"]
# Forwarded to `gumicord-platform`. A consumer that only reads the app's
# state and builds its tree — a scene renderer, say — can turn both off
# and drop the webview and OS-key-store backends out of its link.
webview = ["gumicord-platform/webview"]
keychain = ["gumicord-platform/keychain"]

[dependencies]
accesskit.workspace = true
gumicord-model.workspace = true
gumicord-gateway.workspace = true
gumicord-rest.workspace = true
gumicord-store.workspace = true
gumicord-uitree.workspace = true
gumicord-markdown.workspace = true
gumicord-theme.workspace = true
gumicord-plugin.workspace = true
gumicord-render.workspace = true
gumicord-platform = { workspace = true, default-features = false }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
jpeg-decoder.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
reqwest.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
