[package]
name = "s1-window"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1"
pollster = "1"
wgpu = "30"
winit = "0.30"

# S1 measures in release, close to a distribution build, so binary size
# and start-up time compare.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
